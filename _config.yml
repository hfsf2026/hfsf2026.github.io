# ---------------------------------------------------------------
# Site settings — edit these
# ---------------------------------------------------------------
title: Project for HFSF2026 
description: A collection of projects in jet physics.
author: Hadronic Final State Forum 2026

# If the site lives at https://USERNAME.github.io/REPO-NAME/
# set baseurl to "/REPO-NAME". If it lives at https://USERNAME.github.io/
# leave it as "".
baseurl: ""
url: ""

# Section headings on the projects page, in display order.
# Each project's `category:` must match one of these exactly.
project_categories:
  - Jet Reconstruction
  - Jet Definitions
  - HL-LHC

# ---------------------------------------------------------------
# Build settings — no need to touch
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  math_engine: mathjax

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
